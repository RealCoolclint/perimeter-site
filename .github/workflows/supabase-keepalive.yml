# Keep-alive Supabase (Perimeter) — évite la mise en pause du free tier
# après 7 jours sans activité. Une lecture minimale par jour sur l'API REST.
name: Supabase keep-alive

on:
  schedule:
    - cron: "17 5 * * *"   # tous les jours, 05:17 UTC (07:17 à Paris l'été)
  workflow_dispatch: {}      # lancement manuel possible depuis l'onglet Actions

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Lecture minimale dans Supabase
        env:
          SUPABASE_URL: https://xyipzoqljzgzyexksczy.supabase.co
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "Secret SUPABASE_ANON_KEY absent (Settings > Secrets and variables > Actions)."
            exit 1
          fi
          code=$(curl -sS -o /dev/null -w "%{http_code}" \
            "$SUPABASE_URL/rest/v1/points?select=id&limit=1" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY")
          echo "Réponse Supabase : HTTP $code"
          [ "$code" = "200" ]
